<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Firma de reporte - MEDTECH COLOMBIA</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f6fa;color:#1e2938;overscroll-behavior:auto}
    body{min-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .contenedor{max-width:680px;margin:auto;padding:clamp(8px,2.5vw,20px)}
    .tarjeta{background:#fff;border:1px solid #d7dfeb;border-radius:16px;padding:clamp(12px,3vw,22px);box-shadow:0 8px 24px rgba(32,59,107,.10)}
    h1{margin:0 0 6px;color:#203b6b;font-size:clamp(21px,5.5vw,27px);text-align:center}
    .subtitulo{text-align:center;color:#687487;font-size:clamp(12px,3.5vw,14px);line-height:1.25;margin-bottom:14px}
    .firma-area{border:2px solid #203b6b;border-radius:10px;background:#fff;overflow:hidden;touch-action:auto}
    canvas{display:block;width:100%;height:clamp(270px,48dvh,390px);touch-action:none;background:transparent}
    .linea{border-top:1px solid #888;margin:-34px 7% 0;position:relative;pointer-events:none}
    .indicacion{text-align:center;color:#687487;font-size:12px;margin-top:40px;padding-bottom:3px;pointer-events:none}
    .acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    button{border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:bold;cursor:pointer;min-height:48px}
    #limpiar{background:#e9eef6;color:#203b6b}#guardar{background:#203b6b;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}
    #mensaje{margin-top:14px;padding:12px;border-radius:9px;text-align:center;font-size:14px;display:none;line-height:1.3}
    .ok{display:block!important;background:#dcfce7;color:#166534}.error{display:block!important;background:#fee2e2;color:#991b1b}.info{display:block!important;background:#eaf0f8;color:#203b6b}
    .orientacion{text-align:center;color:#7a8797;font-size:11px;margin-top:8px}
    @media(max-width:430px){
      .contenedor{padding:7px}.tarjeta{padding:12px 10px;border-radius:13px}
      .subtitulo{margin-bottom:10px}canvas{height:clamp(260px,46dvh,340px)}
      .acciones{gap:8px;margin-top:10px}button{padding:12px 8px;font-size:14px}
    }
    @media(orientation:landscape) and (max-height:620px){
      .contenedor{max-width:920px;padding:5px 8px}.tarjeta{padding:7px 10px;border-radius:12px}
      h1{font-size:18px;margin-bottom:1px}.subtitulo{font-size:10.5px;line-height:1.05;margin-bottom:5px}
      canvas{height:clamp(145px,45dvh,235px)}
      .linea{margin:-25px 6% 0}.indicacion{font-size:10px;margin-top:29px;padding-bottom:1px}
      .acciones{margin-top:6px;gap:8px}button{min-height:38px;padding:8px 10px;font-size:13px}
      #mensaje{margin-top:6px;padding:7px;font-size:12px}.orientacion{display:none}
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="tarjeta">
      <h1>Firma del cliente</h1>
      <div class="subtitulo">MEDTECH COLOMBIA<br>Firma asociada al reporte de servicio</div>
      <div class="firma-area">
        <canvas id="firma"></canvas>
        <div class="linea"></div>
        <div class="indicacion">Firme dentro del recuadro utilizando el dedo</div>
      </div>
      <div class="acciones"><button id="limpiar">Limpiar</button><button id="guardar">Guardar firma</button></div>
      <div id="mensaje"></div>
      <div class="orientacion">Puede usar el teléfono vertical u horizontalmente. En horizontal, los controles permanecen visibles.</div>
    </div>
  </div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://ghhqmhftwmqvwznqkiwa.supabase.co';
const SUPABASE_KEY='sb_publishable_TkSZ-G8rqZKLfrNVtz8wTA_rdGmg06M';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const solicitudId=new URLSearchParams(window.location.search).get('solicitud');
const canvas=document.getElementById('firma'),ctx=canvas.getContext('2d');
const botonLimpiar=document.getElementById('limpiar'),botonGuardar=document.getElementById('guardar'),mensaje=document.getElementById('mensaje');
let dibujando=false,tieneFirma=false,lastCssWidth=0,lastCssHeight=0;
function mostrarMensaje(texto,tipo){mensaje.className=tipo;mensaje.textContent=texto}
function configurarTrazo(){ctx.lineWidth=2.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111'}
function ajustarCanvas(){
  if(tieneFirma)return; // Para no deformar una firma ya iniciada al rotar el dispositivo.
  const rect=canvas.getBoundingClientRect(),escala=window.devicePixelRatio||1;
  lastCssWidth=rect.width;lastCssHeight=rect.height;canvas.width=Math.max(1,Math.round(rect.width*escala));canvas.height=Math.max(1,Math.round(rect.height*escala));
  ctx.setTransform(escala,0,0,escala,0,0);configurarTrazo();
}
requestAnimationFrame(ajustarCanvas);
let resizeTimer=null;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(ajustarCanvas,180)});
function posicion(evento){const rect=canvas.getBoundingClientRect();return{x:evento.clientX-rect.left,y:evento.clientY-rect.top}}
canvas.addEventListener('pointerdown',evento=>{evento.preventDefault();dibujando=true;tieneFirma=true;canvas.setPointerCapture(evento.pointerId);const p=posicion(evento);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener('pointermove',evento=>{if(!dibujando)return;evento.preventDefault();const p=posicion(evento);ctx.lineTo(p.x,p.y);ctx.stroke()});
function terminar(evento){dibujando=false;try{if(evento?.pointerId!==undefined&&canvas.hasPointerCapture(evento.pointerId))canvas.releasePointerCapture(evento.pointerId)}catch(e){}}
canvas.addEventListener('pointerup',terminar);canvas.addEventListener('pointercancel',terminar);
botonLimpiar.addEventListener('click',()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();configurarTrazo();tieneFirma=false;mensaje.className='';mensaje.textContent='';ajustarCanvas()});
botonGuardar.addEventListener('click',async()=>{
  if(!solicitudId){mostrarMensaje('Esta solicitud de firma no es válida.','error');return}
  if(!tieneFirma){mostrarMensaje('Primero debe realizar la firma.','error');return}
  botonGuardar.disabled=true;botonLimpiar.disabled=true;mostrarMensaje('Guardando firma...','info');
  const firmaImagen=canvas.toDataURL('image/png');
  const {error}=await supabase.rpc('guardar_firma_cliente',{p_solicitud_id:solicitudId,p_firma:firmaImagen});
  if(error){console.error(error);mostrarMensaje('No fue posible guardar la firma. Intente nuevamente.','error');botonGuardar.disabled=false;botonLimpiar.disabled=false;return}
  mostrarMensaje('Firma registrada exitosamente. Puede cerrar esta ventana.','ok');
});
if(!solicitudId){botonGuardar.disabled=true;mostrarMensaje('No se encontró una solicitud de firma válida.','error')}
</script>
</body>
</html>
